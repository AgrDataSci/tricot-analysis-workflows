name: use-cases

on:
  push:
    paths: ["use-cases/**", ".github/workflows/use-cases.yml"]
  pull_request:
    paths: ["use-cases/**", ".github/workflows/use-cases.yml"]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        usecase: [which-traits-drive-preference]
    defaults:
      run:
        working-directory: use-cases/${{ matrix.usecase }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::PlackettLuce
            any::testthat
            github::AgrDataSci/gosset

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          Rscript tests/run-tests.R 2>&1 | tee tests.log || {
            echo "::error title=tests::$(tail -c 3500 tests.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

      - name: Analysis
        if: always()
        shell: bash
        run: |
          set -o pipefail
          status=0
          Rscript analysis.R 2>&1 | tee analysis.log || status=$?
          echo "::notice title=analysis::$(grep -v '^ *\[' analysis.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs-${{ matrix.usecase }}
          path: use-cases/${{ matrix.usecase }}/outputs/
