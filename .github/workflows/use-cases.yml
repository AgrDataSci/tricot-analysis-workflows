name: use-cases

on:
  push:
    paths: ["use-cases/**", ".github/workflows/use-cases.yml"]
  pull_request:
    paths: ["use-cases/**", ".github/workflows/use-cases.yml"]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        usecase: [which-traits-drive-preference]
    defaults:
      run:
        working-directory: use-cases/${{ matrix.usecase }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::PlackettLuce
            any::testthat
            github::AgrDataSci/gosset

      - name: Tests
        run: Rscript tests/run-tests.R

      - name: Analysis
        run: Rscript analysis.R

      - uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.usecase }}
          path: use-cases/${{ matrix.usecase }}/outputs/
